---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-postgres-17
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
#  inheritedMetadata:
#    annotations:
#      k8up.io/backup: "false"
  storage:
    size: 10Gi
  walStorage:
    size: 3Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
