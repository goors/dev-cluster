---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - https://github.com/keycloak/keycloak-k8s-resources/raw/26.4.2/kubernetes/kubernetes.yml
patches:
  - target:
      kind: ClusterRole
      name: keycloak-operator-clusterrole
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: keycloak-operator-clusterrole
  - target:
      kind: ClusterRole
      name: keycloakcontroller-cluster-role
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: keycloakcontroller-cluster-role
  - target:
      kind: ClusterRole
      name: keycloakrealmimportcontroller-cluster-role
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: keycloakrealmimportcontroller-cluster-role
  - target:
      kind: ClusterRoleBinding
      name: keycloak-operator-clusterrole-binding
    patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: keycloak-operator-clusterrole-binding
  - target:
      kind: Role
      name: keycloak-operator-role
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: keycloak-operator-role
        namespace: default
      rules:
        # Keycloak CRDs (namespaced)
        - apiGroups: ["k8s.keycloak.org"]
          resources:
            - keycloaks
            - keycloaks/status
            - keycloaks/finalizers
            - keycloakrealmimports
            - keycloakrealmimports/status
            - keycloakrealmimports/finalizers
          verbs: ["get","list","watch","create","update","patch","delete"]
        # Workload / service resources
        - apiGroups: ["apps"]
          resources:
            - statefulsets
            - deployments
          verbs: ["get","list","watch","create","update","patch","delete"]
        - apiGroups: [""]
          resources:
            - services
            - secrets
            - configmaps
            - pods
          verbs: ["get","list","watch","create","update","patch","delete"]
        - apiGroups: ["batch"]
          resources:
            - jobs
          verbs: ["get","list","watch","create","update","patch","delete"]
        - apiGroups: ["networking.k8s.io"]
          resources:
            - ingresses
            - networkpolicies
          verbs: ["get","list","watch","create","update","patch","delete"]
        - apiGroups: ["monitoring.coreos.com"]
          resources:
            - servicemonitors
          verbs: ["get","list","watch","create","update","patch","delete"]
  - target:
      kind: RoleBinding
      name: keycloak-operator-role-binding
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: keycloak-operator-role-binding
        namespace: default
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: keycloak-operator-role
      subjects:
        - kind: ServiceAccount
          name: keycloak-operator
          namespace: default
  - target:
      kind: RoleBinding
      name: keycloakrealmimportcontroller-role-binding
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: keycloakrealmimportcontroller-role-binding
        namespace: default
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: keycloak-operator-role
      subjects:
        - kind: ServiceAccount
          name: keycloak-operator
          namespace: default
  - target:
      kind: RoleBinding
      name: keycloakcontroller-role-binding
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: keycloakcontroller-role-binding
        namespace: default
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: keycloak-operator-role
      subjects:
        - kind: ServiceAccount
          name: keycloak-operator
          namespace: default
